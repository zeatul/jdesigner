plugins {
    id 'buildlogic.java-common-conventions'
}

description = 'The pub layer for the bookstore.'

dependencies {
    implementation project(':samples:bookstore-annotations')
    compileOnly project(':jdesigner-generator-annotations')
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    implementation 'io.github.zeatul:hawk-validator:1.3.0-SNAPSHOT'
    implementation 'io.github.zeatul:hawk-core:1.3.0-SNAPSHOT'
    implementation 'org.springframework:spring-context:5.3.39'

    annotationProcessor project(':jdesigner-generator-processor')
    annotationProcessor project(':samples:bookstore-designer')
}

compileJava {
//    enable remote debug
//    options.fork = true
//    options.forkOptions.jvmArgs += ['-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=9000']
//    options.debug = true
//    options.incremental = false
}

sourceSets {
    main {
        java {
            srcDirs += 'src/generated/java'
        }
        resources {
            srcDirs += 'src/generated/resources'
        }
    }
    test {
        java {
            srcDirs += 'src/generatedTest/java'
        }
        resources {
            srcDirs += 'src/generatedTest/resources'
        }
    }
}