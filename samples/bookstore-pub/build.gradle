plugins {
    id 'buildlogic.java-library-conventions'
}

description = 'The pub layer for the bookstore.'

dependencies {
    api project(':samples:bookstore-annotations')
    compileOnly project(':jdesigner-generator-annotations')
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'io.github.zeatul:hawk-validator'

    annotationProcessor project(':jdesigner-generator-processor')
    annotationProcessor project(':samples:bookstore-designer')
}

compileJava {
//    enable remote debug
//    options.fork = true
//    options.forkOptions.jvmArgs += ['-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=9000']
//    options.debug = true
//    options.incremental = false
}

sourceSets {
    main {
        java {
            srcDirs += 'src/generated/java'
        }
        resources {
            srcDirs += 'src/generated/resources'
        }
    }
    test {
        java {
            srcDirs += 'src/generatedTest/java'
        }
        resources {
            srcDirs += 'src/generatedTest/resources'
        }
    }
}
