//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'buildlogic.java-common-conventions'
}

description = 'The persist layer for the bookstore.'

configurations {
    configureEach {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    }
//    compileClasspath {
//        exclude group: 'javax.servlet', module: 'servlet-api'
//    }
}

dependencies {
    implementation 'io.github.zeatul:hawk-dao-base:1.3.0-SNAPSHOT'
    implementation 'io.github.zeatul:j4sql-mybatis:1.2.1-SNAPSHOT'
    implementation 'org.springframework:spring-context:5.3.39'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'

    compileOnly 'io.github.zeatul:j4sql-mybatis-annotations:1.2.1-SNAPSHOT'
    compileOnly project(':samples:bookstore-designer')
    annotationProcessor 'io.github.zeatul:j4sql-mybatis-processor:1.2.1-SNAPSHOT'
    annotationProcessor project(':samples:bookstore-designer')

    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    testImplementation 'io.github.zeatul:j4sql-mybatis-spring:1.2.1-SNAPSHOT'
    testImplementation 'com.mysql:mysql-connector-j:8.0.33'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.1.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-log4j2:3.1.5'
    testImplementation 'net.datafaker:datafaker:2.0.3'
    testImplementation 'org.jeasy:easy-random-core:5.1.0'
    testImplementation 'com.lmax:disruptor:3.4.4'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'
    testImplementation 'org.apache.logging.log4j:log4j-jul:2.23.1'
    testImplementation 'org.slf4j:jul-to-slf4j:2.0.17'

    // Import jdesigner-bom to manage transitive jdesigner dependencies from j4sql
    implementation(platform('io.github.zeatul:jdesigner-bom:1.3.0-SNAPSHOT'))
}

// Don't delete this block
compileJava {
//     enable remote debug
//    options.fork = true
//    options.forkOptions.jvmArgs += ['-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=9000']
//    options.debug = true
//    options.incremental = false
}

sourceSets {
    main {
        java {
            srcDirs += 'src/generated/java'
        }
        resources {
            srcDirs += 'src/generated/resources'
        }
    }
    test {
        java {
            srcDirs += 'src/generatedTest/java'
        }
        resources {
            srcDirs += 'src/generatedTest/resources'
        }
    }
}
