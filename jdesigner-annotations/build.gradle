plugins {
    id 'buildlogic.java-library-conventions'
}

description = 'Define models with annotations.'

dependencies {
    compileOnlyApi project(':jdesigner-spec')
    compileOnlyApi 'org.springframework:spring-core'
    compileOnlyApi 'com.google.guava:guava'

    testImplementation 'com.google.guava:guava'
}

// Apply BOM for version management
dependencies {
    implementation(platform('io.github.zeatul:hawk-dependencies-bom:1.3.0-SNAPSHOT'))
    implementation(platform('io.github.zeatul:hawk-framework-bom:1.3.0-SNAPSHOT'))
}
