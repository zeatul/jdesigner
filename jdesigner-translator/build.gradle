plugins {
    id 'buildlogic.java-library-conventions'
}

description = 'An example project that uses javapoet-pro to translate the models to the Java codes.'

dependencies {
    api project(':jdesigner-spec')
    api 'io.github.zeatul:hawk-core'
    api 'io.github.zeatul:javapoet-pro'
    api 'io.github.zeatul:ddlpoet'
}
