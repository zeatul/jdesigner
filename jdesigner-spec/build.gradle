plugins {
    id 'buildlogic.java-library-conventions'
}

description = 'Provides definitions across three layers: Metadata (data types, domains, metadata), Database Tables (columns, tables, indexes, primary keys), and Java Code (types, fields, methods, annotations, constructors, and exceptions).'

dependencies {
    api 'com.google.code.findbugs:jsr305'
}

// Apply BOM for version management
dependencies {
    implementation(platform('io.github.zeatul:hawk-dependencies-bom:1.3.0-SNAPSHOT'))
    implementation(platform('io.github.zeatul:hawk-framework-bom:1.3.0-SNAPSHOT'))
}
